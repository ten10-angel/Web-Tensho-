# この Astro プロジェクトの中身を GitHub リポジトリ直下に置く構成です。
backend:
  name: github
  repo: ten10-angel/Web-Tensho-
  branch: main
  site_domain: silly-mochi-3a18fb.netlify.app
  auth_scope: public_repo

publish_mode: editorial_workflow
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: site
    label: 固定ページ
    files:
      - name: about
        label: ABOUT
        file: src/content/site/about.json
        format: json
        fields:
          - { name: headlineBefore, label: 見出し・1行目, widget: string }
          - { name: headlineMiddle, label: 見出し・2行目, widget: string }
          - { name: headlineAccent, label: 見出し・強調部分, widget: string }
          - { name: lead, label: リード文, widget: text }
          - { name: body, label: 本文, widget: text }
          - { name: from, label: 出身, widget: string }
          - { name: focus, label: 関心・活動, widget: string }
          - { name: status, label: 現在, widget: string }
      - name: history
        label: HISTORY
        file: src/content/site/history.json
        format: json
        fields:
          - name: entries
            label: 年表の項目
            widget: list
            label_singular: 出来事
            summary: '{{fields.year}} — {{fields.title}}'
            fields:
              - { name: year, label: 時期, widget: string }
              - { name: phase, label: 英語ラベル, widget: string }
              - { name: title, label: 見出し, widget: string }
              - { name: body, label: 本文, widget: text }
              - { name: note, label: 注記, widget: string, required: false }

  - name: work
    label: WORK
    label_singular: 作品
    folder: src/content/work
    create: true
    delete: true
    extension: md
    format: frontmatter
    identifier_field: slug
    slug: '{{fields.slug}}'
    summary: '{{fields.title}}'
    fields:
      - { name: slug, label: URL用ID, widget: string, hint: '半角英数字とハイフン。作成後は変更しないでください。', pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '半角小文字・数字・ハイフンで入力'] }
      - { name: title, label: タイトル, widget: string }
      - { name: date, label: 日付, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
      - { name: published, label: 公開表示, widget: boolean, default: true, hint: 'オフにすると公開ブランチにあってもサイトには表示されません。下書き保存は上部の「Save draft」を使用。' }
      - { name: type, label: 種別・年, widget: string }
      - { name: summary, label: 一覧の説明, widget: text }
      - name: photos
        label: 写真（複数可）
        widget: list
        required: false
        default: []
        label_singular: 写真
        summary: '{{fields.alt}}'
        fields:
          - { name: image, label: 画像, widget: image }
          - { name: alt, label: 画像の説明, widget: string, required: false }
      - { name: body, label: 詳細本文, widget: markdown, required: false }

  - name: journal
    label: JOURNAL
    label_singular: 短文
    folder: src/content/journal
    create: true
    delete: true
    extension: md
    format: frontmatter
    identifier_field: slug
    slug: '{{fields.slug}}'
    summary: '{{fields.date}} — {{fields.summary}}'
    fields:
      - { name: slug, label: URL用ID, widget: string, hint: 'タイトルがなくても必要です。例：2026-10-16-note-01', pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '半角小文字・数字・ハイフンで入力'] }
      - { name: title, label: タイトル（任意）, widget: string, required: false }
      - { name: date, label: 日付, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
      - { name: published, label: 公開表示, widget: boolean, default: true }
      - { name: summary, label: 一覧に表示する短文, widget: text }
      - { name: body, label: 本文, widget: markdown, required: false }

  - name: essay
    label: ESSAY
    label_singular: 長文記事
    folder: src/content/essay
    create: true
    delete: true
    extension: md
    format: frontmatter
    identifier_field: slug
    slug: '{{fields.slug}}'
    summary: '{{fields.title}}'
    fields:
      - { name: slug, label: URL用ID, widget: string, hint: '半角英数字とハイフン。作成後は変更しないでください。', pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '半角小文字・数字・ハイフンで入力'] }
      - { name: title, label: タイトル, widget: string }
      - { name: date, label: 日付, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
      - { name: published, label: 公開表示, widget: boolean, default: true }
      - { name: category, label: カテゴリー表示, widget: string, required: false }
      - { name: summary, label: 一覧の概要, widget: text }
      - { name: readingTime, label: 読了目安, widget: string, required: false }
      - { name: body, label: 本文（Markdown）, widget: markdown }
